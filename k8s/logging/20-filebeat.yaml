apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
- apiGroups: [""]
  resources: [pods, namespaces, nodes]
  verbs: [get, list, watch]
- apiGroups: ["apps"]
  resources: [replicasets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: logging
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: filestream
      id: demo-nginx
      paths:
      - /var/log/containers/*_demo_nginx-*.log
      parsers:
      - container: ~
      prospector:
        scanner:
          symlinks: true
          fingerprint.enabled: true
      file_identity.fingerprint: ~
    processors:
    - add_kubernetes_metadata:
        host: ${NODE_NAME}
        matchers:
        - logs_path:
            logs_path: "/var/log/containers/"
    output.elasticsearch:
      hosts: ["http://elasticsearch.logging.svc:9200"]
      index: "demo-logs-%{+yyyy.MM.dd}"
    setup.ilm.enabled: false
    setup.template.name: "demo-logs"
    setup.template.pattern: "demo-logs-*"
    setup.template.settings:
      index.number_of_replicas: 0
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: logging
  labels: {app: filebeat}
spec:
  selector:
    matchLabels: {app: filebeat}
  template:
    metadata:
      labels: {app: filebeat}
    spec:
      serviceAccountName: filebeat
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:9.5.4
        args: ["-e", "-c", "/etc/filebeat.yml", "--strict.perms=false"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        securityContext:
          runAsUser: 0
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 200Mi}
        volumeMounts:
        - {name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true}
        - {name: data, mountPath: /usr/share/filebeat/data}
        - {name: varlog, mountPath: /var/log, readOnly: true}
      volumes:
      - name: config
        configMap: {name: filebeat-config}
      - name: data
        hostPath: {path: /var/lib/filebeat-data, type: DirectoryOrCreate}
      - name: varlog
        hostPath: {path: /var/log}
