apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
  labels: {app: elasticsearch}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: elasticsearch}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
        env:
        - {name: discovery.type, value: single-node}
        - {name: xpack.security.enabled, value: "false"}
        - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
        ports:
        - {name: http, containerPort: 9200}
        readinessProbe:
          httpGet: {path: "/_cluster/health?local=true", port: http}
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests: {cpu: 200m, memory: 900Mi}
          limits: {memory: 1400Mi}
        volumeMounts:
        - {name: data, mountPath: /usr/share/elasticsearch/data}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector: {app: elasticsearch}
  ports:
  - {name: http, port: 9200, targetPort: http}